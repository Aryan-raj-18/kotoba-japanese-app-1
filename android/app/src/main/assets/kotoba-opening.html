/* =====================================================================
   Kotoba Immersive UI Shell
   ---------------------------------------------------------------------
   Non-invasive visual wrapper. It deliberately does not redefine routes,
   data, forms, page scripts, IDs, or learning logic. Existing components
   remain the source of truth; this file only changes presentation.

   IMPORTANT: this shell no longer ships its own fixed color palette.
   Earlier it redefined --paper/--card-bg/--ink/etc. under
   [data-ui-shell="immersive"] to one hardcoded dark scheme, which sat at
   the same CSS specificity as the theme picker's [data-theme="…"] rules
   in style.css and loaded after them — so it silently won every time,
   and switching themes in the settings panel had no visible effect.
   Instead, every "glass" surface below reads the *current* theme's own
   tokens (--paper, --card-bg, --ink, --indigo, --seal, --line, …) and
   only adds translucency + blur on top of them with color-mix(). Pick
   Sumi and the glass goes dark; pick Sakura and it goes a soft pink —
   the shell is a finish, not a competing theme.

   Each color-mix() line is preceded by a plain fallback using the same
   variable name. Browsers without color-mix() support simply keep the
   opaque fallback (a custom property with an unparsable value is
   dropped, not blank), so the UI stays fully readable either way.
   ===================================================================== */

html[data-ui-shell="immersive"] {
  --shell-radius: 22px;

  /* Card / panel surfaces. ~92% of the theme's own card color, so the
     glass reads as "the theme, lightly frosted" rather than "see-through". */
  --shell-surface: var(--card-bg);
  --shell-surface: color-mix(in srgb, var(--card-bg) 92%, transparent);
  --shell-surface-strong: var(--card-bg);
  --shell-surface-strong: color-mix(in srgb, var(--card-bg) 96%, transparent);

  /* Floating header / bottom nav — slightly lighter than cards so they
     still read as a distinct layer floating over content. */
  --shell-header-bg: var(--paper);
  --shell-header-bg: color-mix(in srgb, var(--paper) 90%, transparent);

  --shell-border: var(--line);
  --shell-border: color-mix(in srgb, var(--ink) 14%, var(--line));

  --shell-input-bg: var(--surface);
  --shell-input-bg: color-mix(in srgb, var(--surface) 90%, transparent);

  --shell-active-bg: var(--indigo);
}

html[data-ui-shell="immersive"],
html[data-ui-shell="immersive"] body {
  min-height: 100%;
}

/* Ambient body wash, built from the active theme's own wash colors
   (already tuned per-theme in style.css) rather than a fixed dark
   gradient, so it shifts with the theme too. */
html[data-ui-shell="immersive"] body {
  background:
    radial-gradient(ellipse at 12% 8%, var(--bg-wash-1), transparent 40%),
    radial-gradient(ellipse at 88% 16%, var(--bg-wash-2), transparent 42%),
    radial-gradient(ellipse at 50% 105%, var(--bg-wash-1), transparent 46%),
    var(--paper);
  background-attachment: fixed;
}

   USER WALLPAPER
   ---------------------------------------------------------------------
   Presentation-only: the chosen image/GIF is stored as a Blob in
   IndexedDB on this device (ui-shell.js) and painted here as a fixed
   layer behind the app. A theme-colored scrim sits on top of it at an
   adjustable strength (the "Dim" slider) so body text and kana/kanji
   stay legible over any photo — the scrim uses --paper, so it darkens
   for dark themes and stays light for light themes instead of always
   flattening everything to black.
   ================================================================== */
.kotoba-wallpaper {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  background-color: var(--paper);
}
.kotoba-wallpaper::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--paper);
  opacity: var(--wallpaper-scrim, 0.6);
}
html[data-ui-shell="immersive"] body.has-kotoba-wallpaper {
  background: var(--paper);
}
html[data-ui-shell="immersive"] .seal-bg { z-index: 1; }
html[data-ui-shell="immersive"] .site-main,
html[data-ui-shell="immersive"] .site-footer {
  position: relative;
  z-index: 2;
}

/* Subtle paper-grain dot texture, colored from the theme's own ink
   pattern token instead of a fixed white, so it stays visible without
   ever looking like a mistake on a light theme. */
html[data-ui-shell="immersive"] .seal-bg {
  opacity: 0.65;
  background-image:
    var(--theme-motif, none);
  background-size: var(--theme-motif-size, 180px);
}

/* Floating glass header */
html[data-ui-shell="immersive"] .site-header {
  position: sticky;
  top: 0;
  z-index: 200;
  margin: 12px auto 0;
  width: min(1180px, calc(100% - 24px));
  padding: 12px 16px;
  gap: 12px;
  border: 1px solid var(--shell-border);
  border-radius: 24px;
  background: var(--shell-header-bg);
  backdrop-filter: blur(22px) saturate(135%);
  -webkit-backdrop-filter: blur(22px) saturate(135%);
  box-shadow: var(--shadow-lg);
}

}

  border-bottom-color: transparent;
  background: var(--shell-surface-strong);
  border-radius: 999px;
  padding: 7px 13px;

/* Main content becomes the translucent surface over the backdrop. */
html[data-ui-shell="immersive"] .site-main {
  max-width: 1180px;
  padding-top: 34px;
  padding-bottom: 110px;
}

html[data-ui-shell="immersive"] .hero {

}

/* Cards: same links and click handlers, new glass presentation. */
html[data-ui-shell="immersive"] .path-grid {
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));

}
html[data-ui-shell="immersive"] .path-card,
html[data-ui-shell="immersive"] .quiz-card,
html[data-ui-shell="immersive"] .explain-card,
html[data-ui-shell="immersive"] .section-card,
html[data-ui-shell="immersive"] .jp-card,

/* Wallpaper controls live inside the existing settings panel. */

html[data-ui-shell="immersive"] .wallpaper-reposition-btn,
html[data-ui-shell="immersive"] .wallpaper-clear-btn {

}

}

/* Image framing editor. The original Blob is kept intact, including GIF
   animation; only zoom and focal position are saved. */
.wallpaper-crop-overlay {
  position: fixed;
  inset: 0;
  z-index: 1900;
  display: grid;
  place-items: center;
  padding: max(14px, env(safe-area-inset-top, 0px)) 14px max(14px, env(safe-area-inset-bottom, 0px));

}

  overflow: auto;
  padding: 20px;

  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
}

.wallpaper-crop-frame::after {

    linear-gradient(to right, transparent 33.15%, rgba(255,255,255,.42) 33.33%, transparent 33.52%, transparent 66.48%, rgba(255,255,255,.42) 66.67%, transparent 66.85%),
    linear-gradient(to bottom, transparent 33.15%, rgba(255,255,255,.42) 33.33%, transparent 33.52%, transparent 66.48%, rgba(255,255,255,.42) 66.67%, transparent 66.85%);

html[data-ui-shell="immersive"] :is(.detail-info,.rad-panel-body,.rad-ex-body,.continue-copy,.chapter-copy,.home-hero-copy,.settings-row > span) {min-width:0;max-width:100%;}
html[data-ui-shell="immersive"] .reading-list > div {min-width:0;max-width:100%;}
html[data-ui-shell="immersive"] :is(.detail-actions,.rm-btn-row,.stage-controls,.jlpt-level-tabs,.practice-cta-row,.settings-goal-chips) {display:flex;flex-wrap:wrap;gap:8px;}

/* The generic glass-panel rule above sets max-width:100%, which for this absolutely positioned
   dropdown means 100% of the 40px settings-button wrapper (a thin vertical strip). Restore its
   real size on desktop; on phones it is a fixed bottom sheet and already sizes itself. */
/* The dropdown lives inside the blurred header, so its own backdrop blur cannot reach the page
   behind it and a see-through fill lets the page text bleed into the menu. Keep it opaque. */
html[data-ui-shell="immersive"] #settings-panel.settings-panel {background-color:var(--card-bg) !important;background-image:none !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important;}

 html[data-ui-shell="immersive"] .settings-panel {width:min(320px,calc(100vw - 24px)) !important;max-width:calc(100vw - 24px) !important;min-width:min(260px,calc(100vw - 24px)) !important;}
}

 background-color:var(--card-bg);color:var(--ink);background-image:none;
